<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五代历史知识图谱</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦏</text></svg>">
<style>
  :root {
    --bg: #050508;
    --card: #0a0a12;
    --border: #1a1a2e;
    --cyan: #00f5ff;
    --magenta: #ff00ff;
    --purple: #9d00ff;
    --blue: #0080ff;
    --amber: #ffaa00;
    --red: #ff3366;
    --green: #00ff88;
    --pink: #ff66aa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 赛博朋克背景 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(0,245,255,0.02) 1px, transparent 1px),
      linear-gradient(rgba(0,245,255,0.02) 1px, transparent 1px),
      radial-gradient(ellipse at 20% 20%, rgba(157,0,255,0.1) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(0,245,255,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(255,0,255,0.05) 0%, transparent 70%);
    background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%, 100% 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* 扫描线效果 */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.1) 2px,
      rgba(0,0,0,0.1) 4px
    );
    pointer-events: none;
    z-index: 1001;
  }

  /* 扫描线动画 */
  @keyframes scan-line {
    0% { transform: translateY(-100%); opacity: 0; }
    10% { opacity: 0.3; }
    90% { opacity: 0.3; }
    100% { transform: translateY(100vh); opacity: 0; }
  }

  .scan-line {
    position: fixed;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
    box-shadow: 0 0 20px var(--cyan), 0 0 40px var(--magenta);
    pointer-events: none;
    z-index: 1000;
    animation: scan-line 6s linear infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.1); }
  }

.header {
    background: linear-gradient(180deg, rgba(10,10,18,0.99) 0%, rgba(5,5,8,0.98) 100%);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, var(--cyan) 20%, var(--magenta) 50%, var(--purple) 80%, transparent 100%);
    box-shadow: 0 0 20px var(--cyan), 0 0 40px var(--magenta);
  }
  .header h1 {
    font-size: 18px;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan), 0 0 40px rgba(0,245,255,0.5);
    letter-spacing: 2px;
    font-weight: 600;
    white-space: nowrap;
  }
  .header .sub {
    font-size: 11px;
    color: #4a5568;
    margin-top: 3px;
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .header-left {
    flex-shrink: 0;
    white-space: nowrap;
  }
  .stats-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .stat-item {
    background: rgba(0,245,255,0.08);
    border: 1px solid rgba(0,245,255,0.2);
    padding: 4px 12px;
    border-radius: 2px;
    font-size: 11px;
    color: #94a3b8;
    letter-spacing: 1px;
  }
  .stat-item span {
    font-weight: 700;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan);
  }

  /* ── 一级功能导航栏 ── */
  .primary-nav {
    display: flex;
    align-items: center;
    gap: 0;
    background: linear-gradient(180deg, rgba(10,10,18,0.98) 0%, rgba(5,5,8,0.96) 100%);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
    padding: 0;
  }
  .primary-nav::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(0,245,255,0.3) 30%, rgba(255,0,255,0.2) 70%, transparent 100%);
  }
  .pnav-item {
    flex: none;
    padding: 10px 28px;
    font-size: 13px;
    font-weight: 600;
    color: #4a5568;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 2px;
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid transparent;
    user-select: none;
  }
  .pnav-item:hover {
    color: #e2e8f0;
    background: rgba(255,255,255,0.03);
  }
  .pnav-item.active {
    color: var(--cyan);
    border-bottom-color: var(--cyan);
    text-shadow: 0 0 12px var(--cyan);
    background: rgba(0,245,255,0.04);
  }
  .pnav-item .pnav-icon { font-size: 16px; }
  .pnav-item .pnav-label { }
  .pnav-divider {
    width: 1px;
    height: 24px;
    background: var(--border);
    flex-shrink: 0;
  }

  .main { flex: 1; display: flex; overflow: hidden; }

  /* 一级视图容器 */
  .primary-view { display: none; flex: 1; overflow: hidden; min-height: 0; }
  .primary-view.active { display: flex; }

  /* 实体浏览独立视图 */
  .browse-view {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .browse-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, rgba(10,10,18,0.99) 0%, rgba(5,5,8,0.98) 100%);
    min-width: 0;
    min-height: 0;
  }
  .browse-main-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    background: rgba(0,0,0,0.3);
  }
  .browse-main-header h2 {
    font-size: 16px;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan);
    letter-spacing: 2px;
    font-weight: 600;
  }
  .browse-main-body {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
  }
  .browse-left-tree {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
    overflow: hidden;
    min-height: 0;
  }
  .browse-right-detail {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  .browse-right-detail .detail-content {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
  }

  /* 藩镇官职独立视图 */
  .fanzhen-view {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }
  .fanzhen-view iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

.graph-panel { flex: 1; position: relative; display: flex; flex-direction: column; min-width: 0; }
  .toolbar {
    padding: 10px 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: linear-gradient(180deg, rgba(10,10,18,0.95) 0%, rgba(5,5,8,0.9) 100%);
  }
  .btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 2px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
    background: transparent;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
  }
  .btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.5s;
  }
  .btn:hover::before { left: 100%; }
  .btn:hover {
    border-color: var(--cyan);
    color: var(--cyan);
    box-shadow: 0 0 20px rgba(0,245,255,0.3), inset 0 0 20px rgba(0,245,255,0.1);
    text-shadow: 0 0 10px var(--cyan);
  }
  .btn-blue {
    border-color: var(--cyan);
    color: var(--cyan);
    text-shadow: 0 0 5px var(--cyan);
    box-shadow: 0 0 15px rgba(0,245,255,0.2);
  }
  .btn-blue:hover {
    background: rgba(0,245,255,0.1);
    box-shadow: 0 0 30px rgba(0,245,255,0.5), inset 0 0 30px rgba(0,245,255,0.1);
  }
  .btn-ghost {
    background: transparent;
    color: #64748b;
    border: 1px solid var(--border);
  }
  .btn-ghost:hover {
    border-color: var(--purple);
    color: var(--purple);
    box-shadow: 0 0 15px rgba(157,0,255,0.3);
    text-shadow: 0 0 8px var(--purple);
  }
  .btn-amber {
    border-color: var(--amber);
    color: var(--amber);
    text-shadow: 0 0 5px var(--amber);
    box-shadow: 0 0 15px rgba(255,170,0,0.2);
  }
  .btn-amber:hover {
    background: rgba(255,170,0,0.1);
    box-shadow: 0 0 30px rgba(255,170,0,0.5), inset 0 0 30px rgba(255,170,0,0.1);
  }
  .search-group { margin-left: auto; display: flex; gap: 6px; }
  .search-group input {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: rgba(0,0,0,0.5);
    color: #e2e8f0;
    font-size: 12px;
    width: 160px;
    outline: none;
    transition: all 0.3s;
  }
  .search-group input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 15px rgba(0,245,255,0.3);
  }
  .search-group input::placeholder { color: #4a5568; }
.graph-area { flex: 1; position: relative; }
  #graph-container { position: absolute; inset: 0; }
  .overlay-msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }
  .overlay-msg.hidden { display: none; }
  .overlay-msg .icon {
    width: 180px;
    height: 180px;
    margin: 0 auto 16px auto;
    filter: drop-shadow(0 0 15px var(--cyan)) drop-shadow(0 0 30px rgba(0,245,255,0.3));
    animation: holoPulse 3s ease-in-out infinite;
  }
  .overlay-msg .icon svg {
    width: 100%;
    height: 100%;
  }
  @keyframes holoPulse {
    0%, 100% { filter: drop-shadow(0 0 12px var(--cyan)) drop-shadow(0 0 25px rgba(0,245,255,0.2)); opacity: 0.85; }
    50% { filter: drop-shadow(0 0 20px var(--cyan)) drop-shadow(0 0 40px rgba(0,245,255,0.4)); opacity: 1; }
  }
  .overlay-msg .text { font-size: 16px; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); letter-spacing: 2px; }
  .overlay-msg .hint { font-size: 12px; color: #4a5568; margin-top: 6px; letter-spacing: 1px; }
  .spinner-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    text-align: center;
    display: none;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 8px;
    box-shadow: 0 0 20px rgba(0,245,255,0.3);
  }
  .err-toast {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, rgba(255,51,102,0.2) 0%, rgba(255,0,255,0.15) 100%);
    border: 1px solid rgba(255,51,102,0.4);
    color: #fca5a5;
    padding: 10px 18px;
    border-radius: 4px;
    font-size: 12px;
    z-index: 100;
    display: none;
    max-width: 80%;
    text-align: center;
    text-shadow: 0 0 5px var(--red);
    box-shadow: 0 0 20px rgba(255,51,102,0.2);
  }

/* Right Panel */
  .right-panel {
    width: 400px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, rgba(10,10,18,0.99) 0%, rgba(5,5,8,0.98) 100%);
    border-left: 1px solid var(--border);
    overflow: hidden;
    position: relative;
  }
  .right-panel::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(180deg, transparent 0%, var(--magenta) 30%, var(--cyan) 70%, transparent 100%);
    box-shadow: 0 0 20px var(--magenta), 0 0 40px var(--cyan);
  }
  .panel-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: rgba(0,0,0,0.3);
  }
  .panel-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    color: #64748b;
    border-bottom: 2px solid transparent;
    transition: all 0.3s;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .panel-tab.active {
    color: var(--magenta);
    border-bottom-color: var(--magenta);
    text-shadow: 0 0 10px var(--magenta);
  }
  .panel-tab:hover { color: #e2e8f0; }
  .tab-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .tab-pane { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .tab-pane.active { display: flex; }

/* QA pane - 聊天气泡样式 */
  .qa-msgs { flex: 1; overflow-y: auto; padding: 16px 12px; }
  .qa-msgs::-webkit-scrollbar { width: 3px; }
  .qa-msgs::-webkit-scrollbar-track { background: var(--bg); }
  .qa-msgs::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--cyan), var(--magenta)); border-radius: 2px; }
  .msg { margin-bottom: 16px; display: flex; flex-direction: column; }
  .msg-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .msg-avatar.user-avatar {
    background: linear-gradient(135deg, rgba(157,0,255,0.4), rgba(255,0,255,0.3));
    border: 1px solid rgba(157,0,255,0.5);
  }
  .msg-avatar.ai-avatar {
    background: linear-gradient(135deg, rgba(0,245,255,0.2), rgba(0,128,255,0.2));
    border: 1px solid rgba(0,245,255,0.4);
  }
  .msg-bubble { max-width: 85%; position: relative; }
  .msg-q {
    background: linear-gradient(135deg, rgba(157,0,255,0.2) 0%, rgba(255,0,255,0.12) 100%);
    border: 1px solid rgba(157,0,255,0.35);
    padding: 10px 14px;
    border-radius: 16px 16px 4px 16px;
    font-size: 13px;
    color: #e2e8f0;
    line-height: 1.6;
    box-shadow: 0 2px 8px rgba(157,0,255,0.1);
  }
  .msg-a {
    background: linear-gradient(135deg, rgba(0,245,255,0.06) 0%, rgba(0,128,255,0.04) 100%);
    border: 1px solid rgba(0,245,255,0.2);
    padding: 12px 14px;
    border-radius: 16px 16px 16px 4px;
    font-size: 13px;
    line-height: 1.8;
    color: #cbd5e1;
    box-shadow: 0 2px 8px rgba(0,245,255,0.08);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg-meta {
    font-size: 10px;
    color: #4a5568;
    margin-top: 4px;
    padding-left: 40px;
    letter-spacing: 1px;
  }
  .presets {
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: rgba(0,0,0,0.3);
  }
  .presets h4 { font-size: 10px; color: #64748b; margin-bottom: 6px; letter-spacing: 2px; text-transform: uppercase; }
  .preset-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 6px 10px;
    margin-bottom: 3px;
    font-size: 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 2px;
    cursor: pointer;
    color: #94a3b8;
    transition: all 0.3s;
  }
  .preset-btn:hover {
    border-color: var(--purple);
    color: var(--purple);
    box-shadow: 0 0 15px rgba(157,0,255,0.2);
    text-shadow: 0 0 8px var(--purple);
  }
  .qa-input {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    background: rgba(0,0,0,0.3);
  }
  .qa-input input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: rgba(0,0,0,0.5);
    color: #e2e8f0;
    font-size: 13px;
    outline: none;
    transition: all 0.3s;
  }
  .qa-input input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 15px rgba(0,245,255,0.2);
  }
  .qa-input input::placeholder { color: #4a5568; }

/* Detail pane */
  .detail-content { flex: 1; overflow-y: auto; padding: 14px; }
  .detail-content::-webkit-scrollbar { width: 3px; }
  .detail-content::-webkit-scrollbar-track { background: var(--bg); }
  .detail-content::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--cyan), var(--magenta)); border-radius: 2px; }
  .detail-header { margin-bottom: 14px; }
  .detail-header h3 {
    color: var(--amber);
    font-size: 18px;
    margin-bottom: 6px;
    text-shadow: 0 0 10px var(--amber);
    letter-spacing: 1px;
  }
  .detail-header .badge {
    display: inline-block;
    background: linear-gradient(135deg, rgba(0,128,255,0.2), rgba(0,245,255,0.15));
    border: 1px solid rgba(0,245,255,0.4);
    color: var(--cyan);
    padding: 3px 10px;
    border-radius: 2px;
    font-size: 10px;
    margin-right: 4px;
    text-shadow: 0 0 5px var(--cyan);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .detail-row { font-size: 12px; margin: 5px 0; line-height: 1.6; color: #cbd5e1; }
  .detail-row .lbl { color: #64748b; font-weight: 500; }
  .detail-section { margin-top: 16px; }
  .detail-section h4 {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 5px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  /* ── 纵向时间轴 ── */
  .timeline { position: relative; padding: 16px 0 16px 0; }
  .timeline-title {
    text-align: center; font-size: 13px; color: var(--amber); letter-spacing: 2px;
    margin-bottom: 14px; text-shadow: 0 0 8px var(--amber);
  }
  .timeline-title .tl-years { font-size: 11px; color: #64748b; font-weight: 400; margin-left: 6px; letter-spacing: 1px; }
  .timeline-track { position: relative; padding-left: 54px; }
  /* 中央竖线 */
  .timeline-track::before {
    content: ''; position: absolute; left: 38px; top: 0; bottom: 0; width: 2px;
    background: linear-gradient(180deg, transparent, var(--cyan) 30px, var(--cyan) calc(100% - 30px), transparent);
    opacity: 0.4;
  }
  .tl-item {
    position: relative; margin-bottom: 20px; cursor: pointer; transition: all 0.3s;
  }
  /* 时间轴节点圆点 */
  .tl-dot {
    position: absolute; left: -22px; top: 6px; width: 10px; height: 10px;
    border-radius: 50%; border: 2px solid var(--cyan);
    background: var(--bg); z-index: 2; transition: all 0.3s;
    box-shadow: 0 0 6px rgba(0,245,255,0.3);
  }
  .tl-item:hover .tl-dot {
    background: var(--cyan); box-shadow: 0 0 12px var(--cyan), 0 0 24px rgba(0,245,255,0.4);
    transform: scale(1.3);
  }
  /* 特殊节点样式 */
  .tl-dot.dot-birth { border-color: var(--green); box-shadow: 0 0 6px rgba(0,255,136,0.3); }

  .tl-dot.dot-death { border-color: var(--red); box-shadow: 0 0 6px rgba(255,51,102,0.3); }

  .tl-dot.dot-throne { border-color: var(--amber); box-shadow: 0 0 6px rgba(255,170,0,0.3); }

  /* 事件卡片 */
  .tl-card {

  .tl-card .tl-name { font-size: 12px; color: var(--cyan); font-weight: 600; text-shadow: 0 0 5px var(--cyan); margin-bottom: 2px; }
  .tl-card .tl-meta { font-size: 10px; color: #64748b; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tl-card .tl-type {
    background: rgba(0,245,255,0.1); border: 1px solid rgba(0,245,255,0.2);

  .tl-type.type-coup { background: rgba(255,0,255,0.12); border-color: rgba(255,0,255,0.25); color: var(--magenta); }
  .tl-type.type-throne { background: rgba(255,170,0,0.12); border-color: rgba(255,170,0,0.25); color: var(--amber); }
  .tl-type.type-betray { background: rgba(255,102,170,0.12); border-color: rgba(255,102,170,0.25); color: var(--pink); }
  .tl-type.type-alliance { background: rgba(0,255,136,0.1); border-color: rgba(0,255,136,0.2); color: var(--green); }
  .tl-card .tl-desc { font-size: 11px; color: #94a3b8; margin-top: 4px; line-height: 1.5; }
  /* 生卒特殊卡片 */
  .tl-card.card-life {
    border-color: rgba(0,255,136,0.25);
    background: linear-gradient(135deg, rgba(0,255,136,0.06) 0%, rgba(0,255,136,0.02) 100%);
  }
  .tl-card.card-life .tl-name { color: var(--green); text-shadow: 0 0 5px var(--green); }
  .tl-card.card-death {

  /* ── 事件详情弹窗 ── */
  .evt-modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); z-index: 2000;
    justify-content: center; align-items: center;
    backdrop-filter: blur(6px);
    opacity: 0; transition: opacity 0.3s ease;
  }
  .evt-modal-overlay.show { display: flex; opacity: 1; }
  .evt-modal-overlay.fade-in { opacity: 1; }
  .evt-modal {
    background: linear-gradient(180deg, rgba(10,10,18,0.99) 0%, rgba(5,5,8,0.98) 100%);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 0; width: 560px; max-width: 92vw; max-height: 82vh;
    overflow: hidden; position: relative;
    transform: translateY(20px) scale(0.97); transition: transform 0.3s ease;
    box-shadow: 0 0 40px rgba(0,245,255,0.1), 0 0 80px rgba(157,0,255,0.08);
  }
  .evt-modal-overlay.fade-in .evt-modal { transform: translateY(0) scale(1); }
  .evt-modal-header {
    padding: 18px 20px 14px; border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, rgba(0,245,255,0.05) 0%, rgba(157,0,255,0.04) 100%);
  }
  .evt-modal-header h3 { font-size: 16px; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); margin-bottom: 6px; }
  .evt-modal-header .badge { display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 10px; margin-right: 6px; }
  .evt-modal-close {
    position: absolute; top: 14px; right: 16px; width: 28px; height: 28px;
    border: 1px solid var(--border); border-radius: 4px; background: rgba(0,0,0,0.5);
    color: #94a3b8; font-size: 14px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: all 0.2s;
  }
  .evt-modal-close:hover { border-color: var(--red); color: var(--red); box-shadow: 0 0 10px rgba(255,51,102,0.3); }
  .evt-modal-body { padding: 16px 20px; overflow-y: auto; max-height: calc(82vh - 90px); }
  .evt-modal-body::-webkit-scrollbar { width: 3px; }
  .evt-modal-body::-webkit-scrollbar-track { background: var(--bg); }
  .evt-modal-body::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--cyan), var(--magenta)); border-radius: 2px; }
  .evt-modal-row { font-size: 12px; margin: 6px 0; line-height: 1.7; color: #cbd5e1; }
  .evt-modal-row .lbl { color: #64748b; font-weight: 500; margin-right: 4px; }
  .evt-modal-section { margin-top: 16px; }
  .evt-modal-section h4 {
    font-size: 11px; color: #94a3b8; margin-bottom: 8px;
    border-bottom: 1px solid var(--border); padding-bottom: 5px; letter-spacing: 2px; text-transform: uppercase;
  }
  .evt-modal-participant {
    display: inline-block; background: rgba(0,245,255,0.08); border: 1px solid rgba(0,245,255,0.2);
    border-radius: 3px; padding: 3px 10px; margin: 3px 4px 3px 0; font-size: 11px;
    color: #cbd5e1; cursor: pointer; transition: all 0.3s;
  }
  .evt-modal-participant:hover { background: rgba(0,245,255,0.18); border-color: var(--cyan); color: var(--cyan); }
  .evt-modal-summary {
    background: rgba(0,245,255,0.03); border: 1px solid var(--border); border-radius: 4px;
    padding: 12px; font-size: 12px; color: #94a3b8; line-height: 1.7;
  }
  /* ev-card: 节点详情面板中的事件卡片 */
  .ev-card {
    background: linear-gradient(135deg, rgba(0,245,255,0.03) 0%, rgba(157,0,255,0.03) 100%);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    transition: all 0.3s; position: relative; overflow: hidden;
  }
  .ev-card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 2px; height: 100%;
    background: linear-gradient(180deg, var(--cyan), var(--magenta)); opacity: 0.5;
  }
  .ev-card:hover { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,245,255,0.15); }
  .ev-card h4 { font-size: 13px; color: var(--cyan); margin-bottom: 3px; text-shadow: 0 0 5px var(--cyan); }
  .ev-card .meta { font-size: 10px; color: #64748b; }
  .ev-card .desc { font-size: 12px; color: #94a3b8; margin-top: 4px; line-height: 1.5; }
  .snippet-card {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .snippet-card .book { font-size: 10px; color: var(--amber); margin-bottom: 4px; text-shadow: 0 0 5px var(--amber); letter-spacing: 1px; }
  .snippet-card .text { font-size: 12px; color: #94a3b8; line-height: 1.6; }
  .snippet-card .text mark {
    background: rgba(255,170,0,0.3);
    color: var(--amber);
    padding: 0 2px;
    border-radius: 2px;
    text-shadow: 0 0 5px var(--amber);
  }
  .rel-tag {
    display: inline-block;
    background: rgba(0,245,255,0.08);
    border: 1px solid rgba(0,245,255,0.2);
    border-radius: 2px;
    padding: 3px 10px;
    margin: 3px 5px 3px 0;
    font-size: 11px;
    color: #cbd5e1;
    cursor: pointer;
    transition: all 0.3s;
  }
  .rel-tag:hover {
    background: rgba(0,245,255,0.15);
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(0,245,255,0.2);
  }
  .rel-tag .rtype { color: #64748b; font-size: 10px; }
  .participant-tag {
    display: inline-block;
    background: rgba(255,51,102,0.15);
    border: 1px solid rgba(255,51,102,0.3);
    border-radius: 2px;
    padding: 3px 10px;
    margin: 3px 5px 3px 0;
    font-size: 11px;
    color: #fca5a5;
    cursor: pointer;
    transition: all 0.3s;
  }
  .participant-tag:hover {
    background: rgba(255,51,102,0.3);
    box-shadow: 0 0 10px rgba(255,51,102,0.2);
  }
  .empty { padding: 40px; text-align: center; color: #374151; font-size: 12px; letter-spacing: 2px; }
  .ispin { display: inline-block; width: 14px; height: 14px; border: 2px solid #475569; border-top-color: var(--blue); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }

/* Summary markdown styles */
  .summary-box {
    background: linear-gradient(135deg, rgba(0,245,255,0.03) 0%, rgba(157,0,255,0.03) 100%);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px 16px;
    margin: 12px 0;
    line-height: 1.8;
    font-size: 13px;
    color: #cbd5e1;
    position: relative;
    overflow: hidden;
  }
  .summary-box::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--purple));
    box-shadow: 0 0 10px var(--cyan);
  }
  .summary-box h1, .summary-box h2, .summary-box h3, .summary-box h4 { color: var(--amber); margin: 10px 0 6px; text-shadow: 0 0 8px var(--amber); }
  .summary-box h1 { font-size: 16px; } .summary-box h2 { font-size: 15px; } .summary-box h3 { font-size: 14px; } .summary-box h4 { font-size: 13px; }
  .summary-box strong { color: #f8fafc; font-weight: 700; }
  .summary-box em { color: #94a3b8; }
  .summary-box ul, .summary-box ol { padding-left: 20px; margin: 6px 0; }
  .summary-box li { margin: 3px 0; }
  .summary-box p { margin: 6px 0; }
  .summary-box blockquote {
    border-left: 3px solid var(--cyan);
    padding-left: 12px;
    color: #94a3b8;
    margin: 8px 0;
    background: rgba(0,245,255,0.03);
  }
  .summary-loading { text-align: center; padding: 20px; color: #64748b; font-size: 12px; letter-spacing: 2px; }
  .summary-label {
    font-size: 12px;
    color: var(--cyan);
    font-weight: 600;
    margin-top: 14px;
    margin-bottom: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 0 8px var(--cyan);
  }

  /* Events pane */
  .events-list { flex: 1; overflow-y: auto; padding: 12px; }
  .events-list::-webkit-scrollbar { width: 3px; }
  .events-list::-webkit-scrollbar-track { background: var(--bg); }
  .events-list::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--cyan), var(--magenta)); border-radius: 2px; }

  /* Browse pane - 实体浏览树形列表 */
  .browse-pane { flex: 1; overflow-y: auto; padding: 0; min-height: 0; }
  .browse-pane::-webkit-scrollbar { width: 3px; }
  .browse-pane::-webkit-scrollbar-track { background: var(--bg); }
  .browse-pane::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--cyan), var(--magenta)); border-radius: 2px; }

  .browse-breadcrumb {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: rgba(0,0,0,0.3);
    font-size: 11px;
    color: #64748b;
    flex-wrap: wrap;
  }
  .browse-crumb {
    color: var(--cyan);
    cursor: pointer;
    transition: all 0.2s;
    padding: 2px 4px;
    border-radius: 2px;
  }
  .browse-crumb:hover { background: rgba(0,245,255,0.1); text-shadow: 0 0 8px var(--cyan); }
  .browse-crumb.current { color: #e2e8f0; cursor: default; }
  .browse-crumb.current:hover { background: transparent; text-shadow: none; }
  .browse-sep { color: #374151; font-size: 10px; }

  .browse-list { flex: 1; overflow-y: auto; padding: 4px 0; min-height: 0; }

  .browse-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    cursor: pointer;
    transition: all 0.2s;
    border-bottom: 1px solid rgba(255,255,255,0.02);
    position: relative;
  }
  .browse-item:hover {
    background: linear-gradient(90deg, rgba(0,245,255,0.06) 0%, transparent 100%);
  }
  .browse-item:active {
    background: rgba(0,245,255,0.1);
  }
  .browse-item .bi-icon {
    font-size: 16px;
    flex-shrink: 0;
    width: 24px;
    text-align: center;
  }
  .browse-item .bi-body { flex: 1; min-width: 0; }
  .browse-item .bi-name {
    font-size: 13px;
    color: #e2e8f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .browse-item .bi-sub {
    font-size: 10px;
    color: #4a5568;
    margin-top: 1px;
  }
  .browse-item .bi-count {
    font-size: 10px;
    color: #4a5568;
    flex-shrink: 0;
    background: rgba(255,255,255,0.04);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .browse-item .bi-arrow {
    color: #374151;
    font-size: 12px;
    flex-shrink: 0;
    transition: color 0.2s, transform 0.2s;
  }
  .browse-item:hover .bi-arrow { color: var(--cyan); }
  .browse-item:hover .bi-name { color: var(--cyan); }

  .browse-item.entity-leaf .bi-name { color: #cbd5e1; }
  .browse-item.entity-leaf:hover .bi-name { color: var(--amber); }
  .browse-item.entity-leaf .bi-arrow { display: none; }

  /* 树形展开：一级目录激活态 */
  .browse-item.cat-active {
    background: linear-gradient(90deg, rgba(0,245,255,0.08) 0%, transparent 100%);
    border-left: 2px solid var(--cyan);
  }
  .browse-item.cat-active .bi-name { color: var(--cyan); text-shadow: 0 0 8px rgba(0,245,255,0.3); }
  .browse-item.cat-active .bi-arrow { color: var(--cyan); transform: rotate(90deg); }

  /* 树形展开：二级子容器 */
  .browse-sub-container {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.3s ease;
    background: rgba(0,0,0,0.15);
    border-left: 2px solid rgba(0,245,255,0.15);
    margin-left: 12px;
  }
  .browse-sub-container.expanded {
    max-height: 6000px;
  }
  .browse-sub-container .browse-item {
    padding: 7px 12px 7px 10px;
  }
  .browse-sub-container .browse-item .bi-icon { font-size: 14px; width: 20px; }
  .browse-sub-container .browse-item .bi-name { font-size: 12px; }
  .browse-sub-container .browse-item .bi-count { font-size: 9px; padding: 1px 6px; }

  /* 三级子容器（实体列表） */
  .browse-sub-container .browse-sub-container {
    margin-left: 8px;
    border-left-color: rgba(0,245,255,0.08);
  }
  .browse-sub-container .browse-sub-container .browse-item {
    padding: 6px 10px 6px 8px;
  }
  .browse-sub-container .browse-sub-container .browse-item .bi-name { font-size: 11px; }

  /* 二级目录激活态 */
  .browse-item.sub-active {
    background: linear-gradient(90deg, rgba(0,245,255,0.05) 0%, transparent 100%);
    border-left: 2px solid rgba(0,245,255,0.4);
  }
  .browse-item.sub-active .bi-name { color: var(--cyan); }
  .browse-item.sub-active .bi-arrow { color: var(--cyan); transform: rotate(90deg); }

  /* 搜索框在子容器内 */
  .browse-sub-search {
    padding: 6px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .browse-sub-search input {
    width: 100%;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: rgba(0,0,0,0.4);
    color: #e2e8f0;
    font-size: 11px;
    outline: none;
    transition: border-color 0.3s;

  .browse-sub-search input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 6px rgba(0,245,255,0.15);
  }
  .browse-sub-search input::placeholder { color: #4a5568; }

  .browse-search {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: rgba(0,0,0,0.2);
  }
  .browse-search input {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: rgba(0,0,0,0.4);
    color: #e2e8f0;
    font-size: 12px;
    outline: none;
    transition: all 0.3s;
  }
  .browse-search input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(0,245,255,0.2);
  }
  .browse-search input::placeholder { color: #4a5568; }

  /* Edit buttons */
  .edit-btn {
    background: rgba(0,128,255,0.15);

    border: 1px solid rgba(0,128,255,0.4);
    padding: 4px 12px;

    background: rgba(255,51,102,0.15);
    color: var(--red);
    border-color: rgba(255,51,102,0.4);
  }
  .edit-btn-red:hover {
    background: rgba(255,51,102,0.3);
    box-shadow: 0 0 15px rgba(255,51,102,0.3);

  .edit-btn-green {
    background: rgba(0,255,136,0.15);

    border-color: rgba(0,255,136,0.4);
  }
  .edit-btn-green:hover {
    background: rgba(0,255,136,0.3);
    box-shadow: 0 0 15px rgba(0,255,136,0.3);

/* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: linear-gradient(180deg, rgba(10,10,18,0.99) 0%, rgba(5,5,8,0.98) 100%);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 22px;
    width: 480px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 0 40px rgba(0,245,255,0.2), 0 0 80px rgba(157,0,255,0.1);
  }
  .modal::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--purple));
    box-shadow: 0 0 10px var(--cyan);
  }
  .modal h3 {
    color: var(--amber);
    font-size: 16px;
    margin-bottom: 16px;
    text-shadow: 0 0 10px var(--amber);
    letter-spacing: 1px;
  }
  .modal-row { margin-bottom: 12px; }
  .modal-row label { display: block; font-size: 11px; color: #64748b; margin-bottom: 5px; letter-spacing: 1px; text-transform: uppercase; }
  .modal-row input, .modal-row select, .modal-row textarea {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: rgba(0,0,0,0.5);
    color: #e2e8f0;
    font-size: 13px;
    outline: none;
    font-family: inherit;
    transition: all 0.3s;
  }
  .modal-row input:focus, .modal-row select:focus, .modal-row textarea:focus {
    border-color: var(--cyan);

/* ──── 简易 Markdown → HTML 渲染器 ──── */
function mdToHtml(md) {
  if (!md) return '';
  var html = md;
  // code blocks (```...```)
  html = html.replace(/```[\s\S]*?```/g, function(m) {
    var code = m.replace(/^```\w*\n?/, '').replace(/\n?```$/, '');
    return '<pre style="background:#1e293b;padding:8px;border-radius:4px;overflow-x:auto;font-size:12px;"><code>' + esc(code) + '</code></pre>';
  });
  // headers
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // blockquote
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  // unordered list
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, function(m) { return '<ul>' + m + '</ul>'; });
  // ordered list
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // paragraphs
  html = html.replace(/\n{2,}/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  if (!html.startsWith('<')) html = '<p>' + html + '</p>';
  return html;
}

function render(data, opts) {
  hideOverlay();
  showSpin(false);
  opts = opts || {};

  if (!data || !data.nodes || !data.nodes.length) { showErr('没有找到数据'); return; }
  if (typeof vis === 'undefined' || !vis.Network) { showErr('vis-network 库尚未加载完成'); return; }

  try {
    var nodeCount = data.nodes.length;
    var edgeCount = data.edges.length;

    // Limit events displayed in graph for person view (keep only top 30 events by year closeness)
    var maxEvents = opts.maxEvents || 30;
    var personNodes = [], eventNodes = [], otherNodes = [];
    data.nodes.forEach(function(n) {
      var lb = (n.labels && n.labels[0]) || 'Person';
      if (lb === 'Event') eventNodes.push(n);
      else if (lb === 'Person') personNodes.push(n);
      else otherNodes.push(n);
    });

    // If too many events, keep only maxEvents
    if (eventNodes.length > maxEvents) {
      eventNodes.sort(function(a, b) { return ((a.props||{}).year||0) - ((b.props||{}).year||0); });
      eventNodes = eventNodes.slice(0, maxEvents);
    }

    var filteredNodes = personNodes.concat(otherNodes).concat(eventNodes);
    var nodeIds = {};
    filteredNodes.forEach(function(n) { nodeIds[n.uid] = true; });

    var filteredEdges = data.edges.filter(function(e) {
      return nodeIds[e.source] && nodeIds[e.target];
    });

    _allNodes = filteredNodes;

var nodes = filteredNodes.map(function(n) {
      var lb = (n.labels && n.labels[0]) || 'Person';
      var isCenter = opts.centerUid && n.uid === opts.centerUid;
      var nodeColor = NC[lb] || '#ff3366';
      return {
        id: n.uid, label: n.name || n.uid,
        color: {
          background: nodeColor,
          border: isCenter ? '#fff' : nodeColor,
          highlight: { background: '#fff', border: nodeColor },
          hover: { background: nodeColor, border: '#fff' }
        },
        font: { color: '#fff', size: lb === 'Event' ? 10 : 13, strokeWidth: 3, strokeColor: 'rgba(0,0,0,0.9)' },
        shape: lb === 'Person' ? 'dot' : lb === 'Dynasty' ? 'diamond' : lb === 'Event' ? 'square' : lb === 'OfficialTitle' ? 'hexagon' : 'triangle',
        size: isCenter ? 28 : (lb === 'Dynasty' ? 22 : lb === 'Person' ? 16 : lb === 'OfficialTitle' ? 18 : 10),
        borderWidth: isCenter ? 4 : 2,
        borderWidthSelected: 5,
        shadow: {
          enabled: true,
          color: nodeColor + '44',
          size: isCenter ? 25 : 10,
          x: 0,
          y: 0
        },
        _raw: n
      };
    });

var edges = filteredEdges.map(function(e, i) {
      var isEvent = e.rel_type === 'PARTICIPATED_IN' || e.rel_type === 'PARTICIPATED_IN_BATTLE';
      var edgeColor = EC[e.rel_type] || '#4b5563';
      return {
        id: 'e' + i, from: e.source, to: e.target,
        label: isEvent ? '' : relCN(e.rel_type),
        color: {
          color: edgeColor + '18',
          highlight: edgeColor + 'ff',
          hover: edgeColor + 'bb',
          opacity: 1.0
        },
        font: { size: 9, color: 'rgba(100,116,139,0.25)', strokeWidth: 0, background: 'transparent' },
        arrows: { to: { scaleFactor: isEvent ? 0.2 : 0.4 } },
        smooth: { type: 'curvedCW', roundness: 0.12 },
        width: isEvent ? 0.3 : 0.8,
        hoverWidth: 3,
        selectionWidth: 4,
        shadow: { enabled: false },
        _raw: e
      };
    });

    var container = $('graph-container');
    if (net) { net.destroy(); net = null; }

    // Sparser physics: higher repulsion, longer springs
    var totalN = nodes.length;
    var gravConst = totalN > 100 ? -120 : totalN > 50 ? -100 : -80;
    var springLen = totalN > 100 ? 250 : totalN > 50 ? 200 : 160;

net = new vis.Network(container,
      { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) },
      {
        physics: {
          solver: 'forceAtlas2Based',
          forceAtlas2Based: {
            gravitationalConstant: gravConst,
            centralGravity: 0.005,
            springLength: springLen,
            springConstant: 0.02,
            damping: 0.85,
            avoidOverlap: 0.8
          },
          stabilization: { iterations: 200 },
          maxVelocity: 30
        },
        interaction: {
          hover: true,
          tooltipDelay: 150,
          zoomView: true,
          dragView: true,
          navigationButtons: false,
          keyboard: true
        },
        layout: { improvedLayout: totalN < 60 },
        nodes: {
          chosen: {
            node: function(values, id, selected, hovering) {
              if (hovering || selected) {
                values.shadowSize = 40;
                values.size = values.size * 1.15;
              }
            }
          }
        },
        edges: {
          chosen: {
            edge: function(values, id, selected, hovering) {
              if (selected) {
                values.width = 4;
                values.shadow = true;
                values.shadowSize = 25;
                values.shadowColor = 'rgba(0,245,255,0.6)';
              } else if (hovering) {
                values.width = 3;
                values.shadow = true;
                values.shadowSize = 15;
                values.shadowColor = 'rgba(0,245,255,0.4)';
              }
            }
          }
        }
      }
    );

    /* ── 选中/悬停节点时，高亮关联边和相邻节点，其他淡化 ── */
    var _nodesDS = net.body.data.nodes;
    var _edgesDS = net.body.data.edges;
    var _allNodeIds = nodes.map(function(n) { return n.id; });
    var _allEdgeIds = edges.map(function(e) { return e.id; });
    var _neighborMap = {}; // nodeId -> Set of connected edgeIds
    var _edgeNodeMap = {}; // edgeId -> {from, to}
    edges.forEach(function(e) {
      if (!_neighborMap[e.from]) _neighborMap[e.from] = [];
      if (!_neighborMap[e.to]) _neighborMap[e.to] = [];
      _neighborMap[e.from].push(e.id);
      _neighborMap[e.to].push(e.id);
      _edgeNodeMap[e.id] = { from: e.from, to: e.to };
    });

    function highlightConnected(selectedNodeId) {
      if (!selectedNodeId) {
        // 恢复所有节点和边
        var resetNodes = _allNodeIds.map(function(id) {
          return { id: id, opacity: 1.0, font: { color: '#fff', size: nodes.find(function(n){return n.id===id;}).font.size, strokeWidth: 3, strokeColor: 'rgba(0,0,0,0.9)' } };
        });
        var resetEdges = _allEdgeIds.map(function(id) {
          var origEdge = edges.find(function(e){return e.id===id;});
          return { id: id, color: origEdge.color, width: origEdge.width, font: origEdge.font };
        });
        _nodesDS.update(resetNodes);
        _edgesDS.update(resetEdges);
        return;
      }
      var connEdges = _neighborMap[selectedNodeId] || [];
      var connNodeSet = {};
      connNodeSet[selectedNodeId] = true;
      connEdges.forEach(function(eid) {
        var ep = _edgeNodeMap[eid];
        connNodeSet[ep.from] = true;
        connNodeSet[ep.to] = true;
      });
      var connEdgeSet = {};
      connEdges.forEach(function(eid) { connEdgeSet[eid] = true; });

      var updNodes = _allNodeIds.map(function(id) {
        if (connNodeSet[id]) {
          return { id: id, opacity: 1.0, font: { color: '#fff', size: nodes.find(function(n){return n.id===id;}).font.size, strokeWidth: 3, strokeColor: 'rgba(0,0,0,0.9)' } };
        } else {
          return { id: id, opacity: 0.12, font: { color: 'rgba(255,255,255,0.1)', size: 8, strokeWidth: 0 } };
        }
      });
      var updEdges = _allEdgeIds.map(function(id) {
        var origEdge = edges.find(function(e){return e.id===id;});
        var rawColor = EC[origEdge._raw.rel_type] || '#4b5563';
        if (connEdgeSet[id]) {
          return {
            id: id,
            color: { color: rawColor + 'ee', highlight: rawColor + 'ff', hover: rawColor + 'ff' },
            width: 2.5,
            font: { size: 11, color: rawColor + 'dd', strokeWidth: 0, background: 'rgba(0,0,0,0.8)' },
            shadow: { enabled: true, color: rawColor + '80', size: 15, x: 0, y: 0 }
          };
        } else {
          return {
            id: id,
            color: { color: rawColor + '06', highlight: rawColor + '06', hover: rawColor + '06' },
            width: 0.2,
            font: { size: 0, color: 'transparent' },
            shadow: { enabled: false }
          };
        }
      });
      _nodesDS.update(updNodes);
      _edgesDS.update(updEdges);
    }

    net.on('click', function(p) {
      if (p.nodes.length) {
        var nodeId = p.nodes[0];
        highlightConnected(nodeId);
        var nd = nodes.find(function(x) { return x.id === nodeId; });
        if (nd && nd._raw) {
          onNodeClick(nd._raw);
        }
      } else if (p.edges.length) {
        // 点击边时也高亮两端节点
        var edgeId = p.edges[0];
        var ep = _edgeNodeMap[edgeId];
        if (ep) {
          // 高亮两个端点
          var combined = {};
          combined[ep.from] = true;
          combined[ep.to] = true;
          var connE = [];
          _allEdgeIds.forEach(function(eid) {
            var eep = _edgeNodeMap[eid];
            if ((combined[eep.from] && combined[eep.to])) connE.push(eid);
          });
          var updN = _allNodeIds.map(function(id) {
            if (combined[id]) {
              return { id: id, opacity: 1.0, font: { color: '#fff', size: nodes.find(function(n){return n.id===id;}).font.size, strokeWidth: 3, strokeColor: 'rgba(0,0,0,0.9)' } };
            } else {
              return { id: id, opacity: 0.12, font: { color: 'rgba(255,255,255,0.1)', size: 8, strokeWidth: 0 } };
            }
          });
          var connESet = {};
          connE.forEach(function(eid) { connESet[eid] = true; });
          var updE = _allEdgeIds.map(function(id) {
            var origEdge = edges.find(function(e){return e.id===id;});
            var rawColor = EC[origEdge._raw.rel_type] || '#4b5563';
            if (connESet[id]) {
              return { id: id, color: { color: rawColor + 'ee', highlight: rawColor + 'ff', hover: rawColor + 'ff' }, width: 3, font: { size: 12, color: rawColor + 'dd', strokeWidth: 0, background: 'rgba(0,0,0,0.8)' }, shadow: { enabled: true, color: rawColor + '80', size: 15, x: 0, y: 0 } };
            } else {
              return { id: id, color: { color: rawColor + '06', highlight: rawColor + '06', hover: rawColor + '06' }, width: 0.2, font: { size: 0, color: 'transparent' }, shadow: { enabled: false } };
            }
          });
          _nodesDS.update(updN);
          _edgesDS.update(updE);
        }
      } else {
        // 点击空白处恢复
        highlightConnected(null);
      }
    });

    net.on('doubleClick', function(p) {
      if (p.nodes.length) {
        var nodeId = p.nodes[0];
        var nd = nodes.find(function(x) { return x.id === nodeId; });
        if (nd && nd._raw) {
          var lb = (nd._raw.labels && nd._raw.labels[0]) || 'Person';
          if (lb === 'Person') {
            searchAndShow(nd._raw.name || nd._raw.uid);
          }
        }
      }
    });

    net.once('stabilizationIterationsDone', function() {
      net.setOptions({ physics: { enabled: false } });
    });

  } catch (e) {
    showErr('渲染图谱失败: ' + e.message);
  }
}

/* ──── Node Click → Right Panel Detail ──── */

function onNodeClick(raw) {
  var lb = (raw.labels && raw.labels[0]) || 'Person';
  if (lb === 'Person') {
    showPersonDetail(raw.uid || raw.props && raw.props.uid);
  } else if (lb === 'Event') {
    showEventDetail(raw.uid || raw.props && raw.props.uid);
  } else {
    // Dynasty/Place: show basic info
    showBasicDetail(raw);
  }
  switchTab('detail');
}

/* ──── 全局关系类型列表（用于编辑下拉框） ──── */
var ALL_REL_TYPES = [];

  apiFetch('/api/graph/relation_types').then(function(d) {
    ALL_REL_TYPES = d.types || [];

/* ──── 模态框管理 ──── */
function showModal(html) {
  var ov = document.getElementById('modal-overlay');
  document.getElementById('modal-body').innerHTML = html;
  ov.classList.add('show');
}
function hideModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

/* ──── 确认删除弹窗 ──── */
function confirmAction(msg, onConfirm) {
  var h = '<div class="modal"><h3>⚠️ 确认操作</h3>';
  h += '<div class="confirm-msg">' + msg + '</div>';
  h += '<div class="modal-footer">';
  h += '<button class="btn btn-ghost" onclick="hideModal()">取消</button>';
  h += '<button class="btn btn-blue" id="confirm-ok-btn">确认</button>';
  h += '</div></div>';
  showModal(h);
  document.getElementById('confirm-ok-btn').onclick = function() {
    hideModal();
    onConfirm();
  };
}

/* ──── 删除节点 ──── */
function deleteNode(uid, name) {
  confirmAction('确定要删除节点 <strong>' + esc(name) + '</strong> 及其所有关系吗？此操作不可撤销！', function() {
    apiFetch('/api/graph/node/' + uid, { method: 'DELETE' })
      .then(function() {
        showErr('✅ 已删除节点: ' + name);
        $('detail-content').innerHTML = '<div class="empty">节点已删除</div>';
        // 如果当前有图谱，尝试刷新
        if (_currentPersonUid && _currentPersonUid !== uid) {
          loadPersonGraph(_currentPersonUid, '');
        }
      })
      .catch(function(e) { showErr('删除失败: ' + e.message); });
  });
}

/* ──── 删除关系 ──── */
function deleteRelation(sourceUid, targetUid, relType, displayInfo) {
  confirmAction('确定要删除关系 <strong>' + esc(displayInfo) + '</strong> 吗？', function() {
    apiFetch('/api/graph/relation/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source_uid: sourceUid, target_uid: targetUid, rel_type: relType })
    }).then(function() {
      showErr('✅ 关系已删除');
      // 刷新详情
      if (_currentPersonUid) showPersonDetail(_currentPersonUid);
    }).catch(function(e) { showErr('删除关系失败: ' + e.message); });
  });
}

/* ──── 修改关系类型弹窗 ──── */
function editRelationType(sourceUid, targetUid, oldRelType, otherName) {
  var optionsHtml = ALL_REL_TYPES.map(function(t) {
    var sel = t === oldRelType ? ' selected' : '';
    return '<option value="' + esc(t) + '"' + sel + '>' + esc(t) + ' (' + relCN(t) + ')</option>';
  }).join('');

  var h = '<div class="modal"><h3>✏️ 修改关系类型</h3>';
  h += '<div class="modal-row"><label>关系: ' + esc(otherName) + '</label></div>';
  h += '<div class="modal-row"><label>当前类型</label><input value="' + esc(oldRelType) + ' (' + relCN(oldRelType) + ')" disabled></div>';
  h += '<div class="modal-row"><label>新类型（选择已有或手动输入）</label>';
  h += '<select id="edit-rel-select" onchange="document.getElementById(\'edit-rel-input\').value=this.value">' + optionsHtml + '</select></div>';
  h += '<div class="modal-row"><label>或手动输入新类型（英文大写，如 FATHER_OF）</label>';
  h += '<input id="edit-rel-input" value="' + esc(oldRelType) + '" placeholder="输入关系类型"></div>';
  h += '<div class="modal-footer">';
  h += '<button class="btn btn-ghost" onclick="hideModal()">取消</button>';
  h += '<button class="btn btn-blue" onclick="doUpdateRelation(\'' + esc(sourceUid) + '\',\'' + esc(targetUid) + '\',\'' + esc(oldRelType) + '\')">保存</button>';
  h += '</div></div>';
  showModal(h);
}

function doUpdateRelation(sourceUid, targetUid, oldRelType) {
  var newType = document.getElementById('edit-rel-input').value.trim().toUpperCase().replace(/\s+/g, '_');
  if (!newType) { showErr('请输入新的关系类型'); return; }
  if (newType === oldRelType) { hideModal(); return; }
  hideModal();
  apiFetch('/api/graph/relation/update', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source_uid: sourceUid, target_uid: targetUid, old_rel_type: oldRelType, new_rel_type: newType })
  }).then(function() {
    showErr('✅ 关系已修改为 ' + newType);
    loadRelTypes(); // 刷新关系类型列表
    if (_currentPersonUid) showPersonDetail(_currentPersonUid);
  }).catch(function(e) { showErr('修改关系失败: ' + e.message); });
}

/* ──── 新增关系弹窗 ──── */
function addRelationDialog(personUid, personName) {
  var optionsHtml = ALL_REL_TYPES.map(function(t) {
    return '<option value="' + esc(t) + '">' + esc(t) + ' (' + relCN(t) + ')</option>';
  }).join('');

  var h = '<div class="modal"><h3>➕ 为 ' + esc(personName) + ' 新增关系</h3>';
  h += '<div class="modal-row"><label>目标人物名字（搜索已有节点）</label>';
  h += '<input id="add-rel-target" placeholder="输入目标人物名字，如：李克用"></div>';
  h += '<div class="modal-row"><label>关系类型</label>';
  h += '<select id="add-rel-type-select" onchange="document.getElementById(\'add-rel-type-input\').value=this.value">' + optionsHtml + '</select></div>';
  h += '<div class="modal-row"><label>或手动输入关系类型</label>';
  h += '<input id="add-rel-type-input" placeholder="如 FATHER_OF"></div>';
  h += '<div class="modal-row"><label>关系方向</label>';
  h += '<select id="add-rel-dir"><option value="outgoing">' + esc(personName) + ' → 目标</option><option value="incoming">目标 → ' + esc(personName) + '</option></select></div>';
  h += '<div class="modal-row"><label>描述（可选）</label>';
  h += '<input id="add-rel-desc" placeholder="关系描述"></div>';
  h += '<div class="modal-footer">';
  h += '<button class="btn btn-ghost" onclick="hideModal()">取消</button>';
  h += '<button class="btn btn-blue" onclick="doAddRelation(\'' + esc(personUid) + '\')">添加</button>';
  h += '</div></div>';
  showModal(h);
}

function doAddRelation(personUid) {
  var targetName = document.getElementById('add-rel-target').value.trim();
  var relType = document.getElementById('add-rel-type-input').value.trim().toUpperCase().replace(/\s+/g, '_');
  if (!relType) relType = document.getElementById('add-rel-type-select').value;
  var dir = document.getElementById('add-rel-dir').value;
  var desc = document.getElementById('add-rel-desc').value.trim();

  if (!targetName) { showErr('请输入目标人物名字'); return; }
  if (!relType) { showErr('请选择或输入关系类型'); return; }

  // 先搜索目标人物获取 uid
  hideModal();
  apiFetch('/api/graph/search/person', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: targetName })
  }).then(function(d) {
    var results = d.results || [];
    if (!results.length) { showErr('未找到目标人物: ' + targetName); return; }
    var targetUid = results[0].uid;
    var srcUid = dir === 'outgoing' ? personUid : targetUid;
    var tgtUid = dir === 'outgoing' ? targetUid : personUid;
    return apiFetch('/api/graph/relation/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source_uid: srcUid, target_uid: tgtUid, rel_type: relType, description: desc })
    });
  }).then(function(r) {
    if (r) {
      showErr('✅ 关系已添加');
      loadRelTypes();
      if (_currentPersonUid) showPersonDetail(_currentPersonUid);
    }
  }).catch(function(e) { showErr('添加关系失败: ' + e.message); });
}

/* ──── 编辑别名弹窗 ──── */
var _editAliases = [];
function editAliasesDialog(personUid, personName, currentAliases) {
  _editAliases = (currentAliases || []).slice();
  renderAliasEditor(personUid, personName);
}

function renderAliasEditor(personUid, personName) {
  var h = '<div class="modal"><h3>✏️ 编辑别名 - ' + esc(personName) + '</h3>';
  h += '<div class="modal-row"><label>当前别名列表</label><div id="alias-list">';
  _editAliases.forEach(function(a, i) {
    h += '<span class="alias-item">' + esc(a) + '<span class="alias-del" onclick="removeAlias(' + i + ',\'' + esc(personUid) + '\',\'' + esc(personName) + '\')">&times;</span></span>';
  });
  if (!_editAliases.length) h += '<span style="color:#64748b;font-size:12px;">无别名</span>';
  h += '</div></div>';
  h += '<div class="modal-row"><label>添加新别名</label><div class="alias-add-row"><input id="new-alias-input" placeholder="输入别名" onkeydown="if(event.key===\'Enter\')addAliasItem(\'' + esc(personUid) + '\',\'' + esc(personName) + '\')"><button class="btn btn-ghost" style="padding:4px 10px;font-size:12px;" onclick="addAliasItem(\'' + esc(personUid) + '\',\'' + esc(personName) + '\')">+</button></div></div>';
  h += '<div class="modal-footer">';
  h += '<button class="btn btn-ghost" onclick="hideModal()">取消</button>';
  h += '<button class="btn btn-blue" onclick="saveAliases(\'' + esc(personUid) + '\')">保存</button>';
  h += '</div></div>';
  showModal(h);
}

function removeAlias(idx, uid, name) {
  _editAliases.splice(idx, 1);
  renderAliasEditor(uid, name);
}

function addAliasItem(uid, name) {
  var v = document.getElementById('new-alias-input').value.trim();
  if (v && _editAliases.indexOf(v) === -1) {
    _editAliases.push(v);
    renderAliasEditor(uid, name);
  }
}

function saveAliases(uid) {
  hideModal();
  apiFetch('/api/graph/person/aliases', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uid: uid, aliases: _editAliases })
  }).then(function() {
    showErr('✅ 别名已更新');
    if (_currentPersonUid) showPersonDetail(_currentPersonUid);
  }).catch(function(e) { showErr('更新别名失败: ' + e.message); });
}

function showPersonDetail(uid) {
  if (!uid) return;
  var el = $('detail-content');
  el.innerHTML = '<div style="text-align:center;padding:30px;"><span class="ispin"></span> 加载中...</div>';

  apiFetch('/api/graph/person/' + uid + '/detail')
    .then(function(d) {
      var p = d.person;
      var h = '<div class="detail-header">';
      h += '<h3>' + esc(p.name) + '</h3>';
      if (p.role) h += '<span class="badge">' + esc(p.role) + '</span>';
      h += '</div>';

      if (p.aliases && p.aliases.length) {
        window._lastAliases = p.aliases;
        h += '<div class="detail-row"><span class="lbl">别名：</span>' + esc(p.aliases.join('、')) + '<button class="edit-btn" onclick="editAliasesDialog(\'' + esc(uid) + '\',\'' + esc(p.name) + '\', window._lastAliases)">编辑别名</button></div>';
      } else {
        h += '<div class="detail-row"><span class="lbl">别名：</span>无 <button class="edit-btn" onclick="editAliasesDialog(\'' + esc(uid) + '\',\'' + esc(p.name) + '\',[])">添加别名</button></div>';
      }
      if (p.loyalty && p.loyalty.length) h += '<div class="detail-row"><span class="lbl">势力：</span>' + esc(p.loyalty.join(' → ')) + '</div>';
      if (p.birth_year || p.death_year) h += '<div class="detail-row"><span class="lbl">生卒：</span>' + (p.birth_year || '?') + ' — ' + (p.death_year || '?') + '</div>';
      if (p.death_cause) h += '<div class="detail-row"><span class="lbl">死因：</span>' + esc(p.death_cause) + '</div>';
      if (p.description) h += '<div class="detail-row"><span class="lbl">简述：</span>' + esc(p.description) + '</div>';

      // LLM 生平总结区域（占位符，异步加载）
      h += '<div class="detail-section"><div class="summary-label">📝 生平总结</div>';
      h += '<div id="person-summary-box" class="summary-box"><div class="summary-loading"><span class="ispin"></span> AI 生成中...</div></div>';
      h += '</div>';

      // Relations (中文化 + 编辑按钮)
      h += '<div class="detail-section"><h4>人物关系 (' + (d.relations ? d.relations.length : 0) + ') <button class="edit-btn edit-btn-green" onclick="addRelationDialog(\'' + esc(uid) + '\',\'' + esc(p.name) + '\')">＋新增关系</button></h4>';
      if (d.relations && d.relations.length) {
        d.relations.forEach(function(r) {
          var arrow = r.direction === 'outgoing' ? '→' : '←';
          var cnType = relCN(r.rel_type);
          var srcUid = r.direction === 'outgoing' ? uid : r.other_uid;
          var tgtUid = r.direction === 'outgoing' ? r.other_uid : uid;
          h += '<div class="rel-edit-row">';
          h += '<span class="rel-edit-name" onclick="searchAndShow(\'' + esc(r.other_name) + '\')">' + esc(r.other_name) + '</span>';
          h += '<span class="rel-edit-type">' + arrow + ' ' + esc(cnType) + '</span>';
          h += '<span class="rel-edit-actions">';
          h += '<button class="rel-mini-btn" onclick="editRelationType(\'' + esc(srcUid) + '\',\'' + esc(tgtUid) + '\',\'' + esc(r.rel_type) + '\',\'' + esc(r.other_name) + '\')">改</button>';
          h += '<button class="rel-mini-btn del" onclick="deleteRelation(\'' + esc(srcUid) + '\',\'' + esc(tgtUid) + '\',\'' + esc(r.rel_type) + '\',\'' + esc(r.other_name + ' ' + cnType) + '\')">删</button>';
          h += '</span></div>';
        });
      } else {
        h += '<div style="color:#64748b;font-size:12px;padding:4px;">暂无关系</div>';
      }
      h += '</div>';

      // Events
      if (d.events && d.events.length) {
        h += '<div class="detail-section"><h4>参与事件 (' + d.events.length + ')</h4>';
        d.events.forEach(function(e) {
          h += '<div class="ev-card" onclick="showEventModal(\'' + esc(e.uid) + '\')">';
          h += '<h4>' + esc(e.name) + '</h4>';
          h += '<div class="meta">' + (e.year ? '📅 ' + e.year + ' ' : '') +
               (e.event_type ? '<span style="background:#334155;padding:1px 6px;border-radius:3px;font-size:10px;">' + esc(e.event_type) + '</span>' : '') + '</div>';
          if (e.description) h += '<div class="desc">' + esc(e.description.substring(0, 80)) + (e.description.length > 80 ? '...' : '') + '</div>';
          h += '</div>';
        });
        h += '</div>';
      }

      // 编辑操作按钮区
      h += '<div class="detail-section" style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px;">';
      h += '<button class="edit-btn edit-btn-red" onclick="deleteNode(\'' + esc(uid) + '\',\'' + esc(p.name) + '\')">🗑️ 删除此人物</button>';
      h += '</div>';

      el.innerHTML = h;
      _currentPersonUid = uid;
      loadPersonEvents(uid, p);

      // 异步加载 LLM 总结
      apiFetch('/api/graph/person/' + uid + '/summary')
        .then(function(s) {
          var box = document.getElementById('person-summary-box');
          if (box) {
            box.innerHTML = mdToHtml(s.summary);
            if (s.from_cache) {
              box.insertAdjacentHTML('afterend', '<div style="font-size:10px;color:#475569;margin-top:2px;">（已缓存）</div>');
            }
          }
        })
        .catch(function(err) {
          var box = document.getElementById('person-summary-box');
          if (box) box.innerHTML = '<div style="color:#94a3b8;font-size:12px;">总结生成失败: ' + esc(err.message) + '</div>';
        });
    })
    .catch(function(e) { el.innerHTML = '<div class="empty">加载失败: ' + esc(e.message) + '</div>'; });
}

/* ──── API calls ──── */

function apiFetch(url, opts) {
  return fetch(url, opts).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function loadFull() {
  showSpin(true); hideOverlay();
  apiFetch('/api/graph/all?limit=200')
    .then(function(d) { render(d, { maxEvents: 40 }); })
    .catch(function(e) { showSpin(false); showErr('加载全图失败: ' + e.message); });
}

function showSuccession() {
  showSpin(true); hideOverlay();
  apiFetch('/api/graph/succession')
    .then(function(d) {
      var nodes = [], edges = [], seen = {};
      var chain = d.chain || [];
      chain.forEach(function(it) {
        if (!seen[it.person_uid]) {
          nodes.push({ uid: it.person_uid, name: it.person_name, labels: ['Person'], props: { original_name: it.person_name, role: '皇帝' } });
          seen[it.person_uid] = 1;
        }
        var tu = it.target_uid || it.dynasty_uid, tn = it.target_name || it.dynasty_name;
        if (tu && !seen[tu]) {
          var isPerson = tu.indexOf('person_') === 0;
          nodes.push({ uid: tu, name: tn, labels: [isPerson ? 'Person' : 'Dynasty'], props: { original_name: tn, name: tn } });
          seen[tu] = 1;
        }
        if (tu) edges.push({ source: it.person_uid, target: tu, rel_type: it.rel_type || 'SUCCEEDED' });
      });
      render({ nodes: nodes, edges: edges }, { maxEvents: 999 });
    })
    .catch(function(e) { showSpin(false); showErr('皇位更替加载失败: ' + e.message); });
}

function searchAndShow(name) {
  $('search-input').value = name;
  doSearch();
}

function doSearch() {
  var name = $('search-input').value.trim();
  if (!name) return;
  showSpin(true); hideOverlay();
  apiFetch('/api/graph/search/person', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name })
  }).then(function(d) {
    var results = d.results || [];
    if (!results.length) { showSpin(false); showErr('未找到人物: ' + name); return; }
    var person = results[0];
    var uid = person.uid;
    if (!uid) { showSpin(false); showErr('搜索结果缺少 uid'); return; }
    loadPersonGraph(uid, person.name || name);
    loadPersonEvents(uid);
    showPersonDetail(uid);
  }).catch(function(e) { showSpin(false); showErr('搜索失败: ' + e.message); });
}

function loadPersonGraph(uid, displayName) {
  apiFetch('/api/graph/person/' + uid + '/relations')
    .then(function(d) {
      var nodes = [], edges = [], seen = {};
      nodes.push({ uid: uid, name: displayName, labels: ['Person'], props: { original_name: displayName } });
      seen[uid] = 1;
      (d.relations || []).forEach(function(r) {
        if (!seen[r.other_uid]) {
          nodes.push({ uid: r.other_uid, name: r.other_name, labels: r.other_labels || ['Person'], props: { original_name: r.other_name } });
          seen[r.other_uid] = 1;
        }
        var src = r.direction === 'outgoing' ? uid : r.other_uid;
        var tgt = r.direction === 'outgoing' ? r.other_uid : uid;
        edges.push({ source: src, target: tgt, rel_type: r.rel_type });
      });
      render({ nodes: nodes, edges: edges }, { centerUid: uid, maxEvents: 30 });
    })
    .catch(function(e) { showSpin(false); showErr('加载关系失败: ' + e.message); });
}

function loadPersonEvents(uid, personData) {
  apiFetch('/api/graph/person/' + uid + '/events')
    .then(function(d) {
      var el = $('events-list');
      var evts = d.events || [];
      if (!evts.length && !personData) { el.innerHTML = '<div class="empty">该人物暂无关联事件</div>'; return; }

      // 构建时间轴数据：出生 + 事件 + 死亡
      var items = [];
      var pName = (personData && personData.name) || '';
      var birthY = personData && personData.birth_year;
      var deathY = personData && personData.death_year;
      var deathCause = personData && personData.death_cause;

      if (birthY) items.push({ year: birthY, type: 'birth', name: pName + ' 出生', special: true });
      evts.forEach(function(e) { items.push(e); });
      if (deathY) items.push({ year: deathY, type: 'death', name: pName + ' 去世' + (deathCause ? '（' + deathCause + '）' : ''), special: true });

      // 按年份排序（null年份排最后）
      items.sort(function(a, b) {
        var ya = a.year || 9999, yb = b.year || 9999;
        if (ya !== yb) return ya - yb;
        if (a.type === 'birth') return -1;
        if (b.type === 'birth') return 1;
        if (a.type === 'death') return 1;
        if (b.type === 'death') return -1;
        return 0;
      });

      if (!items.length) { el.innerHTML = '<div class="empty">该人物暂无关联事件</div>'; return; }

      // 事件类型 → dot/type class
      function evtClass(t) {
        if (!t) return '';
        if (/战争|战役/.test(t)) return 'war';
        if (/政变/.test(t)) return 'coup';
        if (/皇位|登基|称帝|建国/.test(t)) return 'throne';
        if (/背叛|叛/.test(t)) return 'betray';
        if (/结盟|联盟/.test(t)) return 'alliance';
        return '';
      }

      var h = '<div class="timeline">';
      // 标题
      h += '<div class="timeline-title">' + esc(pName) + ' · 生平时间轴';
      if (birthY || deathY) h += '<span class="tl-years">(' + (birthY || '?') + ' — ' + (deathY || '?') + ')</span>';
      h += '</div>';
      h += '<div class="timeline-track">';

      items.forEach(function(item) {
        var isBirth = item.type === 'birth';
        var isDeath = item.type === 'death';
        var isSpecial = item.special;
        var cls = evtClass(item.event_type);

        h += '<div class="tl-item' + (isSpecial ? ' tl-life' : '') + '"'
           + (isSpecial ? '' : ' onclick="showEventModal(\'' + esc(item.uid) + '\')"') + '>';

        // 年份
        var yrCls = isBirth ? ' yr-life' : (isDeath ? ' yr-death' : '');
        h += '<div class="tl-year' + yrCls + '">' + (item.year || '?') + '</div>';

        // 圆点
        var dotCls = isBirth ? ' dot-birth' : (isDeath ? ' dot-death' : (cls ? ' dot-' + cls : ''));
        h += '<div class="tl-dot' + dotCls + '"></div>';

        // 卡片
        var cardCls = isBirth ? ' card-life' : (isDeath ? ' card-death' : '');
        h += '<div class="tl-card' + cardCls + '">';
        h += '<div class="tl-name">' + esc(item.name) + '</div>';

        if (!isSpecial) {
          h += '<div class="tl-meta">';
          if (item.event_type) h += '<span class="tl-type' + (cls ? ' type-' + cls : '') + '">' + esc(item.event_type) + '</span>';
          if (item.location) h += '<span>📍 ' + esc(item.location) + '</span>';
          h += '</div>';
          if (item.description) {
            var desc = item.description.length > 60 ? item.description.substring(0, 60) + '...' : item.description;
            h += '<div class="tl-desc">' + esc(desc) + '</div>';
          }
        }

        h += '</div>'; // .tl-card
        h += '</div>'; // .tl-item
      });

      h += '</div></div>';
      el.innerHTML = h;
    })
    .catch(function() { $('events-list').innerHTML = '<div class="empty">事件加载失败</div>'; });
}

function askQ(q) {

  div.className = 'msg';

  // AI 气泡（左侧），先显示加载中

    + '<div class="msg-avatar ai-avatar">🤖</div>'
    + '<div class="msg-bubble"><div class="msg-a"><span class="ispin"></span> 思考中...</div></div>'

    // 底部元信息（不显示 Cypher）
    var count = d.graph_data ? d.graph_data.length : 0;
    var metaHtml = '<div class="msg-meta">📊 命中 ' + count + ' 条图谱数据</div>';

    div.innerHTML = userRow + aiContent + metaHtml;
    msgs.scrollTop = msgs.scrollHeight;

    div.querySelector('.msg-a').textContent = '请求失败: ' + e.message;
    div.querySelector('.msg-a').style.color = 'var(--red)';
  });
}
