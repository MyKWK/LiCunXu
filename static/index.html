/* ──── 知识攫取仪表盘 ──── */

var _ingestionInited = false;
var _ingestionTimer = null;
// 速度追踪：用于计算预估剩余时间
var _ingLastPollTime = null;   // 上次轮询的时间戳 (ms)
var _ingLastProcessed = null;  // 上次轮询时已处理数
var _ingSpeedSamples = [];     // 最近的速度采样 (chunks/sec)
var _ingEstRemain = null;      // 最新预估剩余秒数

function loadIngestionDashboard() {
  // 初次加载时显示loading
  var grid = $('ing-entity-grid');
  if (grid && !grid.innerHTML.trim()) {
    grid.innerHTML = '<div class="ing-loading"><span class="ispin"></span> 加载中...</div>';
  }
  _fetchIngestionData();
  // 每30秒自动刷新
  if (_ingestionTimer) clearInterval(_ingestionTimer);
  _ingestionTimer = setInterval(function() {
    if (_currentPrimaryView === 'ingestion') _fetchIngestionData();
  }, 30000);
}

function _fetchIngestionData() {
  apiFetch('/api/ingestion/dashboard')
    .then(function(d) { _renderIngestionDashboard(d); })
    .catch(function(e) {
      var grid = $('ing-entity-grid');
      if (grid) grid.innerHTML = '<div class="ing-loading" style="color:var(--red);">加载失败: ' + esc(e.message) + '</div>';
    });
}

function _renderIngestionDashboard(d) {
  var prog = d.progress || {};
  var stats = d.entity_stats || {};

  // ── 0. 计算处理速度和预估剩余时间 ──
  var nowMs = Date.now();
  var curProcessed = prog.processed_chunks || 0;
  var remaining = prog.remaining || 0;

  if (_ingLastPollTime !== null && _ingLastProcessed !== null) {
    var dtSec = (nowMs - _ingLastPollTime) / 1000;
    var dChunks = curProcessed - _ingLastProcessed;
    if (dtSec > 5 && dChunks > 0) {
      var speed = dChunks / dtSec; // chunks/sec
      _ingSpeedSamples.push(speed);
      if (_ingSpeedSamples.length > 10) _ingSpeedSamples.shift(); // 保留最近10个样本
    }
  }
  _ingLastPollTime = nowMs;
  _ingLastProcessed = curProcessed;

  // 加权平均速度（近期权重更大）
  var avgSpeed = 0;
  if (_ingSpeedSamples.length > 0) {
    var wSum = 0, wTotal = 0;
    for (var si = 0; si < _ingSpeedSamples.length; si++) {
      var w = si + 1;
      wSum += _ingSpeedSamples[si] * w;
      wTotal += w;
    }
    avgSpeed = wSum / wTotal;
  }

  // 判断是否正在运行（通过心跳文件，120秒内有心跳即认为在运行）
  var heartbeat = prog.heartbeat;
  var isRunning = false;
  var hbStatus = '';
  var hbChunk = '';
  var hbWorkers = 0;
  var hbRateLimited = false;
  if (heartbeat && heartbeat.timestamp) {
    var diffSec = (nowMs / 1000) - heartbeat.timestamp;
    hbStatus = heartbeat.status || '';
    hbChunk = heartbeat.current_chunk || '';
    hbWorkers = heartbeat.workers || 1;
    hbRateLimited = heartbeat.rate_limited || false;
    // status=finished 说明已经跑完了
    if (hbStatus === 'finished') {
      isRunning = false;
    } else if (diffSec < 120) {
      isRunning = true;
    }
  }

  // 预估剩余时间
  var etaText = '';
  if (remaining === 0) {
    etaText = '<span style="color:#00ff88">✅ 提取完成</span>';
  } else if (!isRunning) {
    etaText = '<span style="color:#ff8800">⏸ 未在运行</span>';
  } else if (avgSpeed > 0) {
    var etaSec = Math.round(remaining / avgSpeed);
    _ingEstRemain = etaSec;
    if (etaSec < 60) {
      etaText = '预计剩余 <span style="color:var(--cyan)">' + etaSec + ' 秒</span>';
    } else if (etaSec < 3600) {
      etaText = '预计剩余 <span style="color:var(--cyan)">' + Math.round(etaSec / 60) + ' 分钟</span>';
    } else {
      var h = Math.floor(etaSec / 3600);
      var m = Math.round((etaSec % 3600) / 60);
      etaText = '预计剩余 <span style="color:var(--cyan)">' + h + ' 小时 ' + m + ' 分钟</span>';
    }
    etaText += ' <span style="color:#4a5568">(~' + (avgSpeed * 60).toFixed(1) + ' chunks/min)</span>';
  } else {
    etaText = '<span style="color:#64748b">⏳ 采样中（等待2次刷新）...</span>';
  }
  // 附加运行态详情
  if (isRunning && hbChunk) {
    etaText += '<br><span style="color:#718096;font-size:0.75rem">⚙️ 正在处理: ' + hbChunk + '</span>';
    if (hbRateLimited) {
      etaText += ' <span style="color:#f56565;font-size:0.75rem">🚫 限流中(单线程)</span>';
    } else if (hbWorkers > 1) {
      etaText += ' <span style="color:#68d391;font-size:0.75rem">⚡ ' + hbWorkers + '线程并发</span>';
    }
  }

  // ── 1. 进度环 ──
  var pct = prog.percent || 0;
  var circumference = 326.73;
  var offset = circumference - (pct / 100) * circumference;
  var ring = $('ing-ring-fg');
  if (ring) ring.style.strokeDashoffset = offset;
  var pctEl = $('ing-pct');
  if (pctEl) pctEl.textContent = pct + '%';
  var subEl = $('ing-pct-sub');
  if (subEl) subEl.textContent = prog.processed_chunks + ' / ' + prog.total_chunks;
  var detEl = $('ing-progress-detail');
  if (detEl) detEl.innerHTML = '剩余 <span style="color:var(--cyan)">' + remaining + '</span> 个块待处理<br>' + etaText;

  // ── 2. 实体总览 ──
  var entityMap = [
    { key: 'Person', icon: '👤', label: '人物' },
    { key: 'Event', icon: '⚔️', label: '事件' },
    { key: 'Dynasty', icon: '🏛️', label: '政权' },
    { key: 'Place', icon: '📍', label: '地点' },
    { key: 'OfficialTitle', icon: '🎖️', label: '官职' },
    { key: 'Relation', icon: '🔗', label: '关系' },
  ];
  var gridEl = $('ing-entity-grid');
  if (gridEl) {
    var gh = '';
    entityMap.forEach(function(e) {
      gh += '<div class="ing-entity-item">'
        + '<div class="ing-entity-icon">' + e.icon + '</div>'
        + '<div class="ing-entity-count">' + (stats[e.key] || 0).toLocaleString() + '</div>'
        + '<div class="ing-entity-label">' + e.label + '</div>'
        + '</div>';
    });
    gridEl.innerHTML = gh;
  }

  // ── 3. 人物角色分布 ──
  var rolesEl = $('ing-roles-chart');
  if (rolesEl && d.person_roles) {
    var maxRole = d.person_roles.length > 0 ? d.person_roles[0].count : 1;
    var rh = '';
    d.person_roles.slice(0, 8).forEach(function(r) {
      var w = Math.max(2, Math.round(r.count / maxRole * 100));
      rh += '<div class="ing-bar-row">'
        + '<div class="ing-bar-label">' + esc(r.role) + '</div>'
        + '<div class="ing-bar-track"><div class="ing-bar-fill role-bar" style="width:' + w + '%"></div></div>'
        + '<div class="ing-bar-count">' + r.count + '</div>'
        + '</div>';
    });
    rolesEl.innerHTML = rh;
  }

  // ── 4. 事件类型分布 ──
  var eventsEl = $('ing-events-chart');
  if (eventsEl && d.event_types) {
    var maxEv = d.event_types.length > 0 ? d.event_types[0].count : 1;
    var eh = '';
    d.event_types.slice(0, 8).forEach(function(e) {
      var w = Math.max(2, Math.round(e.count / maxEv * 100));
      eh += '<div class="ing-bar-row">'
        + '<div class="ing-bar-label">' + esc(e.type) + '</div>'
        + '<div class="ing-bar-track"><div class="ing-bar-fill event-bar" style="width:' + w + '%"></div></div>'
        + '<div class="ing-bar-count">' + e.count + '</div>'
        + '</div>';
    });
    eventsEl.innerHTML = eh;
  }

  // ── 5. 章节进度 ──
  var chaptersEl = $('ing-chapters-list');
  if (chaptersEl && d.chapter_progress) {
    var ch = '';
    d.chapter_progress.forEach(function(c) {
      var cls = c.percent >= 100 ? 'done' : (c.percent > 0 ? 'partial' : 'empty');
      ch += '<div class="ing-ch-row">'
        + '<div class="ing-ch-name" title="' + esc(c.name) + '">' + esc(c.name) + '</div>'
        + '<div class="ing-ch-bar"><div class="ing-ch-fill ' + cls + '" style="width:' + c.percent + '%"></div></div>'
        + '<div class="ing-ch-pct">' + c.percent + '%</div>'
        + '<div class="ing-ch-count">' + c.processed + '/' + c.total + '</div>'
        + '</div>';
    });
    chaptersEl.innerHTML = ch;
  }

  // ── 6. 关系TOP ──
  var relEl = $('ing-rel-list');
  if (relEl && d.top_relations) {
    var maxRel = d.top_relations.length > 0 ? d.top_relations[0].count : 1;
    var rlh = '';
    d.top_relations.forEach(function(r) {
      var w = Math.max(2, Math.round(r.count / maxRel * 100));
      rlh += '<div class="ing-bar-row">'
        + '<div class="ing-bar-label" title="' + esc(r.type) + '">' + esc(r.type_cn) + '</div>'
        + '<div class="ing-bar-track"><div class="ing-bar-fill rel-bar" style="width:' + w + '%"></div></div>'
        + '<div class="ing-bar-count">' + r.count.toLocaleString() + '</div>'
        + '</div>';
    });
    relEl.innerHTML = rlh;
  }

  // ── 7. 最近处理 ──
  var recentEl = $('ing-recent-list');
  if (recentEl && d.recent_chunks) {
    if (d.recent_chunks.length === 0) {
      recentEl.innerHTML = '<div class="ing-loading">暂无已处理的 chunk</div>';
    } else {
      var rch = '';
      d.recent_chunks.forEach(function(c) {
        rch += '<div class="ing-recent-item">'
          + '<span class="ing-recent-id">' + esc(c.chunk_id) + '</span>'
          + '<span class="ing-recent-ch">' + esc(c.chapter) + '</span>'
          + '<span class="ing-recent-chars">' + (c.char_count || 0) + '字</span>'
          + '</div>';
      });
      recentEl.innerHTML = rch;
    }
  }
}

/* ──── 实体浏览（文件夹树形） ──── */

var _browseInited = false;
var _browseCats = []; // 缓存的一级分类数据

function initBrowse() {
  browseLoadRoot();
}

/* 加载一级分类列表（人物/事件/政权/地点），始终显示 */
function browseLoadRoot() {
  var list = $('browse-list');
  list.innerHTML = '<div class="empty"><span class="ispin"></span> 加载中...</div>';

  apiFetch('/api/browse/categories').then(function(d) {
    var cats = d.categories || [];
    _browseCats = cats;
    var h = '';
    cats.forEach(function(c, i) {
      h += '<div class="browse-item" id="cat-item-' + i + '" data-cat-id="' + esc(c.id) + '" data-cat-idx="' + i + '">';
      h += '<span class="bi-icon">📁</span>';
      h += '<div class="bi-body"><div class="bi-name">' + esc(c.name) + '</div></div>';
      h += '<span class="bi-count">' + c.count + '</span>';
      h += '<span class="bi-arrow">›</span>';
      h += '</div>';
      h += '<div class="browse-sub-container" id="cat-sub-' + i + '"></div>';
    });
    list.innerHTML = h;

    // 绑定一级分类点击（展开/折叠）
    cats.forEach(function(c, i) {
      document.getElementById('cat-item-' + i).onclick = function() {
        toggleCategory(i, c.id, c.name, c.icon);
      };
    });
  }).catch(function(e) {
    list.innerHTML = '<div class="empty">加载失败: ' + esc(e.message) + '</div>';
  });
}

/* 展开/折叠一级分类 */
function toggleCategory(idx, catId, catName, catIcon) {
  var item = document.getElementById('cat-item-' + idx);
  var sub = document.getElementById('cat-sub-' + idx);
  var isExpanded = sub.classList.contains('expanded');

  if (isExpanded) {
    // 折叠
    item.classList.remove('cat-active');
    sub.classList.remove('expanded');
    sub.innerHTML = '';
    return;
  }

  // 展开：先高亮
  item.classList.add('cat-active');
  sub.innerHTML = '<div style="padding:10px 12px;"><span class="ispin"></span> <span style="color:#4a5568;font-size:11px;">加载中...</span></div>';
  sub.classList.add('expanded');

  // 请求二级分组
  apiFetch('/api/browse/' + catId + '/groups').then(function(d) {
    var groups = d.groups || [];
    if (!groups.length) {
      // 无子分组，直接在一级下方展开实体列表
      loadEntitiesIntoContainer(sub, catId, '', '', catName);
      return;
    }
    var h = '';
    groups.forEach(function(g, gi) {
      var subId = 'grp-' + idx + '-' + gi;
      h += '<div class="browse-item" id="' + subId + '-item" data-grp-idx="' + gi + '">';
      h += '<span class="bi-icon">' + (g.icon || '📂') + '</span>';
      h += '<div class="bi-body"><div class="bi-name">' + esc(g.name) + '</div></div>';
      h += '<span class="bi-count">' + g.count + '</span>';
      h += '<span class="bi-arrow">›</span>';
      h += '</div>';
      h += '<div class="browse-sub-container" id="' + subId + '-sub"></div>';
    });
    sub.innerHTML = h;

    // 绑定二级分组点击
    groups.forEach(function(g, gi) {
      var subId = 'grp-' + idx + '-' + gi;
      document.getElementById(subId + '-item').onclick = function(ev) {
        ev.stopPropagation();
        toggleGroup(subId, g.filter.label, g.filter.field, g.filter.value, g.name);
      };
    });
  }).catch(function(e) {
    sub.innerHTML = '<div style="padding:10px 12px;color:#f87171;font-size:11px;">加载失败</div>';
  });
}

/* 展开/折叠二级分组 */
function toggleGroup(subId, label, field, value, groupName) {
  var item = document.getElementById(subId + '-item');
  var sub = document.getElementById(subId + '-sub');
  var isExpanded = sub.classList.contains('expanded');

  if (isExpanded) {
    item.classList.remove('sub-active');
    sub.classList.remove('expanded');
    sub.innerHTML = '';
    return;
  }

  item.classList.add('sub-active');
  sub.innerHTML = '<div style="padding:8px 10px;"><span class="ispin"></span> <span style="color:#4a5568;font-size:11px;">加载中...</span></div>';
  sub.classList.add('expanded');

  loadEntitiesIntoContainer(sub, label, field, value, groupName);
}

/* 在指定容器中加载实体列表 */
function loadEntitiesIntoContainer(container, label, field, value, groupName) {
  var url = '/api/browse/entities?label=' + encodeURIComponent(label);
  if (field) url += '&field=' + encodeURIComponent(field);
  if (value) url += '&value=' + encodeURIComponent(value);

  apiFetch(url).then(function(d) {
    var entities = d.entities || [];
    var entityLabel = d.label;
    if (!entities.length) {
      container.innerHTML = '<div style="padding:8px 12px;color:#4a5568;font-size:11px;">暂无数据</div>';
      return;
    }
    // 搜索框
    var h = '<div class="browse-sub-search"><input placeholder="搜索 ' + esc(groupName) + '..." oninput="filterSubEntities(this)"></div>';
    entities.forEach(function(ent) {
      var subtitle = '';
      if (ent.year) subtitle += ent.year + '年';
      if (ent.sub && ent.sub !== value) subtitle += (subtitle ? ' · ' : '') + ent.sub;
      var icon = entityLabel === 'Person' ? '👤' : entityLabel === 'Event' ? '⚔️' : entityLabel === 'Dynasty' ? '🏛️' : entityLabel === 'OfficialTitle' ? '🎖️' : '📍';
      h += '<div class="browse-item entity-leaf" data-name="' + esc(ent.name).toLowerCase() + '" data-lbl="' + esc(entityLabel) + '" data-uid="' + esc(ent.uid) + '" data-ename="' + esc(ent.name) + '">';
      h += '<span class="bi-icon">' + icon + '</span>';
      h += '<div class="bi-body"><div class="bi-name">' + esc(ent.name) + '</div>';
      if (subtitle) h += '<div class="bi-sub">' + esc(subtitle) + '</div>';
      h += '</div>';
      h += '</div>';
    });
    container.innerHTML = h;

    // 绑定实体点击
    container.querySelectorAll('.entity-leaf').forEach(function(el) {
      el.onclick = function(ev) {
        ev.stopPropagation();
        browseOpenEntity(el.dataset.lbl, el.dataset.uid, el.dataset.ename);
      };
    });
  }).catch(function(e) {
    container.innerHTML = '<div style="padding:8px 12px;color:#f87171;font-size:11px;">加载失败</div>';
  });
}

/* 在子容器内搜索筛选实体 */
function filterSubEntities(input) {
  var kw = input.value.trim().toLowerCase();
  var container = input.closest('.browse-sub-container');
  if (!container) return;
  container.querySelectorAll('.entity-leaf').forEach(function(el) {
    var name = el.dataset.name || '';
    el.style.display = (!kw || name.indexOf(kw) !== -1) ? '' : 'none';
  });
}

function browseOpenEntity(label, uid, name) {
  // 点击具体实体：在浏览视图右侧显示详情
  var detailEl = $('browse-detail-content');
  detailEl.innerHTML = '<div style="text-align:center;padding:30px;"><span class="ispin"></span> 加载中...</div>';

  if (label === 'Person') {
    showPersonDetailIn(detailEl, uid);
  } else if (label === 'Event') {
    showEventDetailIn(detailEl, uid);
  } else {
    showGenericDetailIn(detailEl, label, uid);
  }
}

            if (!hel) return;
            var holders = hd.holders || [];
            if (holders.length === 0) {
              hel.innerHTML = '<span class="lbl">担任者：</span><span style="color:#666;">暂无关联人物</span>';
              return;
            }
            var hh = '<span class="lbl">担任者（' + holders.length + '人）：</span><div style="margin-top:6px;">';
            holders.forEach(function(p) {
              var yr = p.year ? ' (' + p.year + ')' : '';
              hh += '<div style="display:inline-block;background:#ff880015;border:1px solid #ff880033;border-radius:3px;padding:2px 8px;margin:2px;font-size:12px;cursor:pointer;" onclick="goToGraphView(\'' + esc(p.uid) + '\',\'' + esc(p.name) + '\')">';
              hh += '👤 ' + esc(p.name) + '<span style="color:#888;font-size:10px;">' + yr + '</span></div>';
            });
            hh += '</div>';
            hel.innerHTML = hh;
          })
          .catch(function() {});
      }
    })
    .catch(function(e) {
      el.innerHTML = '<div class="empty">加载详情失败: ' + esc(e.message) + '</div>';
    });
}

/* 从浏览视图跳转到图谱视图查看某人物 */
function goToGraphView(uid, name) {
  switchPrimaryView('graph');
  $('search-input').value = name;
  showSpin(true); hideOverlay();
  loadPersonGraph(uid, name);
  loadPersonEvents(uid);
  showPersonDetail(uid);
  switchTab('detail');
}
